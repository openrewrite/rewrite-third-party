name: Generate Quarkus aggregation recipes

on:
  schedule:
    - cron: 0 11 * * TUE
  workflow_dispatch: {}

jobs:
  update-migrations:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'openrewrite'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Match the quarkus-update-recipes release the build shades, as main can reference recipes not yet released
      - name: Check out the latest quarkus-updates release
        run: |
          version=$(curl -fsSL https://repo1.maven.org/maven2/io/quarkus/quarkus-update-recipes/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          git -C quarkus-updates fetch --depth 1 origin "refs/tags/${version}:refs/tags/${version}"
          git -C quarkus-updates checkout "${version}"

      - name: Create quarkus aggregation recipes
        run: ./gradlew generateQuarkusAggregation
        env:
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}

      # Create pull request
      - name: Timestamp
        run: echo "NOW=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_ENV
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: migrations/${{ env.NOW }}
          title: "[Auto] Aggregational Quarkus migration recipes as of ${{ env.NOW }}"
          body: |
            [Auto] Aggregational Quarkus migration recipes as of ${{ env.NOW }}.
          commit-message: "[Auto] Aggregational Quarkus migration recipes as of ${{ env.NOW }}"
          labels: enhancement
      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
