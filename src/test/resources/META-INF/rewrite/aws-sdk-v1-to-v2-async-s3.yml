---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.aws.sdk.AsyncClientAndS3ResidualsWithV2Migration
displayName: Migrate AWS SDK v1 async clients and S3 residuals together with AWS's v2 migration
description: >-
  Runs the async client and S3 gap fillers around `org.openrewrite.aws.sdk.AwsSdkJavaV1ToV2Safe` in the order they need: the pre
  recipes on v1 code, then AWS's migration, then the post recipes on the v2 result. The full migration composes these steps with the
  other gap fillers; this recipe exists to run and verify this slice on its own.
recipeList:
  - org.openrewrite.aws.sdk.PrepareAwsAsyncClientCalls
  - org.openrewrite.aws.sdk.MigrateS3Residuals
  - org.openrewrite.aws.sdk.AwsSdkJavaV1ToV2Safe
  - org.openrewrite.aws.sdk.CompleteAwsAsyncClientCalls
  - org.openrewrite.aws.sdk.FixAutoConstructNullChecks
