type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.thirdparty.sonar.StringRulesJava11
displayName: Picnic `String` rules that need Java 11
description: Runs the Picnic `String` Refaster rules that introduce `String#isBlank()` or `Predicate#not(Predicate)`, on Java 11 and later sources only.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.java.search.HasJavaVersion:
      version: "[11,)"
recipeList:
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$NotStringIsEmptyRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$StringIsBlankRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$OptionalOfNullableFilterNotStringIsEmptyRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$OptionalFilterNotStringIsEmptyRecipe
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.thirdparty.sonar.StringRulesJava15
displayName: Picnic `String` rules that need Java 15
description: Runs the Picnic `String` Refaster rule that introduces `String#formatted(Object...)`, on Java 15 and later sources only.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.java.search.HasJavaVersion:
      version: "[15,)"
recipeList:
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$FormattedRecipe
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.thirdparty.sonar.StringRulesJava21
displayName: Picnic `String` rules that need Java 21
description: Runs the Picnic `String` Refaster rules that introduce `String#indexOf(int, int, int)` or `String#indexOf(String, int, int)`, on Java 21 and later sources only.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.java.search.HasJavaVersion:
      version: "[21,)"
recipeList:
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$MathMaxNegativeOneStringIndexOfMinusIntWithIntRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$MathMaxNegativeOneStringIndexOfMinusStringWithIntRecipe
---
# One per build tool: the combined `java.dependencies` precondition cannot limit Gradle to `compileClasspath`
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.thirdparty.sonar.StringRulesGuavaMaven
displayName: Picnic `String` rules that need Guava, for Maven modules
description: Runs the Picnic `String` Refaster rules that introduce Guava's `Strings` or `Utf8`, in Maven modules with Guava in compile scope only.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.maven.search.ModuleHasDependency:
      groupIdPattern: com.google.guava
      artifactIdPattern: guava
      scope: compile
recipeList:
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$StringsIsNullOrEmptyRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$Utf8EncodedLengthRecipe
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.thirdparty.sonar.StringRulesGuavaGradle
displayName: Picnic `String` rules that need Guava, for Gradle projects
description: Runs the Picnic `String` Refaster rules that introduce Guava's `Strings` or `Utf8`, in Gradle projects with Guava on the `compileClasspath` only.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.gradle.search.ModuleHasDependency:
      groupIdPattern: com.google.guava
      artifactIdPattern: guava
      configuration: compileClasspath
recipeList:
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$StringsIsNullOrEmptyRecipe
  - tech.picnic.errorprone.refasterrules.StringRulesRecipes$Utf8EncodedLengthRecipe
