---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.azure.sdk.MigrateAzureSdkLegacyToCurrent
displayName: Migrate from the legacy Azure SDK for Java to the current Azure SDK
description: >-
  Migrates Java code off the legacy Azure SDK for Java (`com.microsoft.azure` libraries) and ADAL4J onto the current Azure SDK
  (`com.azure` libraries) and MSAL4J: rewrites the calls, retypes the declarations, removes catches of the checked exceptions
  the legacy calls declared, and swaps the dependencies of each module that no longer uses a legacy library. Anything that
  cannot be migrated is marked and listed in the `LegacyAzureSdkRemnants` data table.
tags:
  - azure
  - sdk
recipeList:
  - org.openrewrite.azure.sdk.MigrateAzureStorageBlob
  - org.openrewrite.azure.sdk.MigrateAdal4jToMsal4j
  - org.openrewrite.azure.sdk.MigrateAzureEventHubs
  - org.openrewrite.azure.sdk.MigrateAzureServiceBus
  - org.openrewrite.azure.sdk.search.FindAzureSdkLegacyRemnants
  - org.openrewrite.azure.sdk.ChangeLegacyAzureTypes
  - org.openrewrite.azure.sdk.MigrateAzureSdkDependencies
